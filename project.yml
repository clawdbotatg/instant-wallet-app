# xcodegen spec — `xcodegen generate` → InstantWallet.xcodeproj
# The app is the website: one WKWebView on SITE (InstantWallet/App.swift).
name: InstantWallet
options:
  bundleIdPrefix: io.instantwallet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XX7QP5899Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  InstantWallet:
    type: application
    platform: iOS
    sources:
      - path: InstantWallet
    info:
      path: InstantWallet/Info.plist
      properties:
        CFBundleDisplayName: Instant
        CFBundleName: InstantWallet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIImageName: MarkFaded, UIColorName: Background }   # the logo at 30%, where Splash starts
        NSCameraUsageDescription: Instant Wallet uses the camera to scan QR codes.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true          # portrait only; App Store upload refuses that without it
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Associated Domains: webcredentials (the passkey works in the web view) + applinks (site links open here).
        # The site names this app back at /.well-known/apple-app-site-association. Without both, passkeys fail.
        CODE_SIGN_ENTITLEMENTS: InstantWallet/InstantWallet.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: io.instantwallet
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (the target default is iPhone + iPad)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
